{icon:'⚡',title:L('Energie & Stärke','Енергія та крохмаль'),heading:L('Wozu braucht unser Körper Zucker?','Навіщо нашому тілу цукор?'),cards:[
['⚡',L('Energie','Енергія'),L('Zucker gehört zu den Kohlenhydraten. Er liefert Energie. Unser Gehirn und unsere Muskeln nutzen diese Energie: zum Denken, Gehen und Spielen.','Цукор належить до вуглеводів. Він дає енергію. Мозок і м’язи використовують її, щоб думати, ходити й гратися.')],
['🥔',L('Auch Stärke liefert Energie','Крохмаль теж дає енергію'),L('Brot, Nudeln, Haferflocken und Kartoffeln enthalten Stärke. Stärke besteht aus vielen verbundenen Zuckerbausteinen. Bei der Verdauung zerlegt der Körper sie in einzelne Zuckerbausteine.','Хліб, макарони, вівсяні пластівці та картопля містять крохмаль. Він складається з багатьох з’єднаних частинок цукру. Під час травлення тіло розщеплює їх на окремі частинки.')]],note:L('Wir brauchen Energie. Dafür müssen wir keine Süßigkeiten essen und keinen Zucker ins Essen geben. Vollkornprodukte liefern zusätzlich Ballaststoffe. Sie helfen der Verdauung.','Нам потрібна енергія. Але для цього не обов’язково їсти солодощі чи додавати цукор до їжі. Цільнозернові продукти також дають клітковину. Вона допомагає травленню.')},
{icon:'🍎',title:L('Obst & Saft','Фрукти та сік'),heading:L('Warum ist ein Apfel eine gute Wahl?','Чому яблуко — добрий вибір?'),cards:[
['🍎',L('Mehr als Zucker','Більше, ніж цукор'),L('Obst enthält von Natur aus Zucker. Ein Apfel liefert auch Vitamine, Mineralstoffe und Ballaststoffe. Ballaststoffe unterstützen die Verdauung. Das ganze Lebensmittel zählt.','Фрукти природно містять цукор. Яблуко також дає вітаміни, мінеральні речовини та клітковину. Клітковина допомагає травленню. Важливий продукт у цілому.')],

if(!check(q,value)){state.until=Date.now()+10000;state.wrong=scope;if(scope==='boss'){state.boss=0;save();render();$('#arena').scrollIntoView({block:'center',behavior:'instant'});$('#battleStatus').textContent=T('Haps! Alle Bosstreffer sind weg. Mika kommt gleich zurück.','Хап! Усі влучання скинуто. Міка скоро повернеться.')}else save();syncLock();return false}
state.until=0;state.wrong='';if(scope==='boss'){busy=true;state.boss++;save();$('#arena').scrollIntoView({block:'center',behavior:'instant'});$('#arena').classList.add('attack');$('#battleStatus').textContent=T('Richtig! Mika schickt einen Wissensblitz!','Правильно! Міка посилає блискавку знань!');$('#fb-boss').textContent=T('✓ Richtig! Dein Angriff trifft.','✓ Правильно! Твоя атака влучає.');syncLock();transition=setTimeout(()=>{[...document.querySelectorAll('.hp i')].forEach((el,i)=>el.classList.toggle('empty',i<state.boss));$('#hpText').textContent=`${10-state.boss}/10 ${T('Energie','енергії')}`;transition=setTimeout(()=>{busy=false;render()},800)},850)}else{state.done++;save();render();let taskEl=$('#task-'+(state.done-1));if(taskEl)taskEl.insertAdjacentHTML('beforeend',`<div class="feedback" role="status">${T('✨ Richtig! Die nächste Aufgabe ist frei.','✨ Правильно! Наступне завдання відкрито.')}</div>`)}return true}
function syncLock(){let sec=remaining();$('#language').disabled=busy;document.querySelectorAll('[data-answer],form[data-match] button,form[data-match] select').forEach(b=>b.disabled=busy||sec>0);let fb=state.wrong?$('#fb-'+state.wrong):null;if(sec>0&&fb){if(!fb.classList.contains('wrong')){fb.className='feedback wrong';fb.innerHTML=`<b>${T('Das war leider noch nicht richtig!','Поки що неправильно!')}</b><br>${T('Lies dir die Informationen oben noch einmal genau durch. In 10 Sekunden kannst du es erneut versuchen.','Уважно перечитай інформацію вище. Через 10 секунд можна спробувати знову.')}<br>${state.wrong==='boss'?T('Der Bosskampf beginnt wieder bei Frage 1.','Бій знову почнеться з питання 1.')+'<br>':''}<span class="count" aria-live="off"></span> ${T('Sekunden Lesepause','секунд паузи')}`;}fb.querySelector('.count').textContent=sec;}if(sec===0&&state.wrong){const wasBoss=state.wrong==='boss';state.wrong='';state.until=0;if(fb){fb.className='feedback';fb.innerHTML=`<span class="count">0</span> · ${wasBoss?T('Mika ist zurück. Starte wieder mit Frage 1!','Міка повернувся. Почни з питання 1!'):T('Du kannst es erneut versuchen.','Можна спробувати знову.')}`;}if($('#arena'))$('#arena').classList.remove('swallow');if(wasBoss&&$('#battleStatus'))$('#battleStatus').textContent=T('Neuer Versuch! Zehn Treffer am Stück.','Нова спроба! Десять влучань поспіль.');save();}}
function confetti(){let e=$('#burst');if(e)e.innerHTML=Array.from({length:36},(_,i)=>`<span class="spark" style="left:${i*37%100}%;animation-delay:${i%7*.13}s;color:${['#ffce69','#c5a4f2','#8bdec1'][i%3]}">${i%2?'✦':'●'}</span>`).join('')}
$('#language').onchange=e=>{if(busy)return;state.lang=e.target.value;save();render()};$('#stop').onclick=stopRead;$('#reset').onclick=()=>$('#resetDialog').showModal();$('#cancel').onclick=()=>$('#resetDialog').close();$('#confirm').onclick=()=>{clearTimeout(transition);busy=false;let lang=state.lang;state=fresh();state.lang=lang;$('#resetDialog').close();save();render();window.scrollTo(0,0)};setInterval(syncLock,200);document.addEventListener('visibilitychange',syncLock);render();
